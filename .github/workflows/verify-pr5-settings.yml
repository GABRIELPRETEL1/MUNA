name: Verify PR 5 production settings
on:
  push:
    branches:
      - codex/verify-pr5-settings-20261017
permissions:
  contents: read
jobs:
  tests:
    name: Tests (${{ matrix.target }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [pr5, pr4-compatible]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.target == 'pr5' && '2eb3bea42f3ef49c0cbc6d12f6367dffda765555' || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip freeze
      - name: Production settings tests
        run: python -m unittest pos_project.settings.test_production_settings -v
      - name: Available Django regression tests
        run: python manage.py test apps.pos apps.reports pos_project.settings --settings=pos_project.settings.development --top-level-directory . -v 2
      - name: Development system checks
        run: python manage.py check --settings=pos_project.settings.development
